<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <h1>
        Personal Expense Tracker
    </h1>


    <p class="subtitle">
        Track your expenses and manage your spending.
    </p>



    <!-- ADD EXPENSE FORM -->

    <div class="form-box">

        <h2>
            Add Expense
        </h2>


        <form id="expenseForm">


            <label for="expenseName">
                Expense Name
            </label>

            <input
                type="text"
                id="expenseName"
                placeholder="e.g. Lunch"
                required
            >



            <label for="expenseAmount">
                Amount
            </label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="e.g. 150"
                min="1"
                required
            >



            <label for="expenseCategory">
                Category
            </label>

            <select id="expenseCategory">

                <option value="Food">
                    Food
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Other">
                    Other
                </option>

            </select>



            <label for="expenseDate">
                Date
            </label>

            <input
                type="date"
                id="expenseDate"
                required
            >



            <button
                type="submit"
                class="add-button">

                Add Expense

            </button>


        </form>

    </div>



    <!-- TOTAL -->

    <div class="total-box">

        <h2 class="total-title">
            Total Expenses
        </h2>

        <div id="totalAmount">
            ₹0
        </div>

    </div>



    <!-- EXPENSE LIST -->

    <div class="expense-box">

        <h2>
            Expenses
        </h2>


        <div id="expenseList">

            <p class="empty">
                No expenses added yet.
            </p>

        </div>


    </div>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
