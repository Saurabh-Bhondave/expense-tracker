<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

</head>


<body>

    <h1>Personal Expense Tracker</h1>

    <p>
        Track your expenses and manage your spending.
    </p>


    <h2>Add Expense</h2>


    <form>

        <label>
            Expense Name:
        </label>

        <br>

        <input
            type="text"
            placeholder="e.g. Lunch"
        >

        <br><br>


        <label>
            Amount:
        </label>

        <br>

        <input
            type="number"
            placeholder="e.g. 150"
        >

        <br><br>


        <label>
            Category:
        </label>

        <br>

        <select>

            <option>Food</option>

            <option>Travel</option>

            <option>Shopping</option>

            <option>Bills</option>

            <option>Other</option>

        </select>

        <br><br>


        <label>
            Date:
        </label>

        <br>

        <input
            type="date"
        >

        <br><br>


        <button type="submit">
            Add Expense
        </button>

    </form>


    <h2>Expenses</h2>


    <p>
        No expenses added yet.
    </p>


</body>

</html>
