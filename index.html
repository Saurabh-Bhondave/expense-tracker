<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

</head>


<body>

    <h1>Personal Expense Tracker</h1>

    <p>
        Track your expenses and manage your spending.
    </p>


    <h2>Add Expense</h2>


    <form id="expenseForm">

        <label>
            Expense Name:
        </label>

        <br>

        <input
            type="text"
            id="expenseName"
            placeholder="e.g. Lunch"
            required
        >

        <br><br>


        <label>
            Amount:
        </label>

        <br>

        <input
            type="number"
            id="expenseAmount"
            placeholder="e.g. 150"
            required
        >

        <br><br>


        <label>
            Category:
        </label>

        <br>

        <select id="expenseCategory">

            <option>Food</option>

            <option>Travel</option>

            <option>Shopping</option>

            <option>Bills</option>

            <option>Other</option>

        </select>

        <br><br>


        <label>
            Date:
        </label>

        <br>

        <input
            type="date"
            id="expenseDate"
            required
        >

        <br><br>


        <button type="submit">
            Add Expense
        </button>

    </form>


    <h2>Expenses</h2>


    <div id="expenseList">

        <p>
            No expenses added yet.
        </p>

    </div>


    <script>

        const form =
            document.getElementById("expenseForm");

        const expenseList =
            document.getElementById("expenseList");


        form.addEventListener("submit", function(event) {

            event.preventDefault();


            const name =
                document.getElementById("expenseName").value;

            const amount =
                document.getElementById("expenseAmount").value;

            const category =
                document.getElementById("expenseCategory").value;

            const date =
                document.getElementById("expenseDate").value;


            const expense =
                document.createElement("div");


            expense.innerHTML = `

                <hr>

                <h3>${name}</h3>

                <p>
                    Amount: ₹${amount}
                </p>

                <p>
                    Category: ${category}
                </p>

                <p>
                    Date: ${date}
                </p>

            `;


            expenseList.appendChild(expense);


            form.reset();

        });

    </script>


</body>

</html>
