<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

</head>


<body>

    <h1>Personal Expense Tracker</h1>

    <p>
        Track your expenses and manage your spending.
    </p>


    <h2>Add Expense</h2>


    <form id="expenseForm">

        <label for="expenseName">
            Expense Name:
        </label>

        <br>

        <input
            type="text"
            id="expenseName"
            placeholder="e.g. Lunch"
            required
        >

        <br><br>


        <label for="expenseAmount">
            Amount:
        </label>

        <br>

        <input
            type="number"
            id="expenseAmount"
            placeholder="e.g. 150"
            min="0"
            required
        >

        <br><br>


        <label for="expenseCategory">
            Category:
        </label>

        <br>

        <select id="expenseCategory">

            <option value="Food">Food</option>

            <option value="Travel">Travel</option>

            <option value="Shopping">Shopping</option>

            <option value="Bills">Bills</option>

            <option value="Other">Other</option>

        </select>

        <br><br>


        <label for="expenseDate">
            Date:
        </label>

        <br>

        <input
            type="date"
            id="expenseDate"
            required
        >

        <br><br>


        <button type="submit">
            Add Expense
        </button>

    </form>


    <hr>


    <h2>
        Total Expenses: ₹<span id="totalAmount">0</span>
    </h2>


    <h2>Expenses</h2>


    <div id="expenseList">

        <p id="emptyMessage">
            No expenses added yet.
        </p>

    </div>



    <script>

        // Get the HTML elements

        const form =
            document.getElementById("expenseForm");

        const expenseList =
            document.getElementById("expenseList");

        const totalDisplay =
            document.getElementById("totalAmount");

        const emptyMessage =
            document.getElementById("emptyMessage");


        // Store total amount

        let totalAmount = 0;



        // When the form is submitted

        form.addEventListener("submit", function(event) {

            // Stop the page from refreshing

            event.preventDefault();


            // Get values from the form

            const name =
                document.getElementById("expenseName").value;

            const amount =
                Number(
                    document.getElementById("expenseAmount").value
                );

            const category =
                document.getElementById("expenseCategory").value;

            const date =
                document.getElementById("expenseDate").value;



            // Make sure amount is valid

            if (amount <= 0) {

                alert("Please enter an amount greater than 0.");

                return;

            }



            // Remove "No expenses added yet"

            emptyMessage.style.display = "none";



            // Create a new expense container

            const expense =
                document.createElement("div");


            // Put expense information inside it

            expense.innerHTML = `

                <hr>

                <h3>${name}</h3>

                <p>
                    Amount: ₹${amount}
                </p>

                <p>
                    Category: ${category}
                </p>

                <p>
                    Date: ${date}
                </p>

            `;



            // Add expense to the page

            expenseList.appendChild(expense);



            // Add amount to total

            totalAmount =
                totalAmount + amount;



            // Show updated total

            totalDisplay.textContent =
                totalAmount;



            // Clear the form

            form.reset();

        });

    </script>


</body>

</html>
