<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        h1 {
            text-align: center;
        }

        .form-box,
        .total-box,
        .expense-box {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .total-box {
            text-align: center;
        }

        #totalAmount {
            font-size: 28px;
            font-weight: bold;
        }

        .expense {
            border-top: 1px solid #ddd;
            padding: 15px 0;
        }

        .expense:first-child {
            border-top: none;
        }

        .expense h3 {
            margin: 0 0 10px;
        }

        .expense p {
            margin: 6px 0;
        }

        .empty {
            color: #777;
        }
    </style>
</head>

<body>

    <h1>Personal Expense Tracker</h1>

    <p>
        Track your expenses and manage your spending.
    </p>


    <!-- ADD EXPENSE FORM -->

    <div class="form-box">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <label for="expenseName">
                Expense Name
            </label>

            <input
                type="text"
                id="expenseName"
                placeholder="e.g. Lunch"
                required
            >


            <label for="expenseAmount">
                Amount
            </label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="e.g. 150"
                min="1"
                required
            >


            <label for="expenseCategory">
                Category
            </label>

            <select id="expenseCategory">

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>

            </select>


            <label for="expenseDate">
                Date
            </label>

            <input
                type="date"
                id="expenseDate"
                required
            >


            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>


    <!-- TOTAL -->

    <div class="total-box">

        <h2>Total Expenses</h2>

        <div id="totalAmount">
            ₹0
        </div>

    </div>


    <!-- EXPENSE LIST -->

    <div class="expense-box">

        <h2>Expenses</h2>

        <div id="expenseList">

            <p id="emptyMessage" class="empty">
                No expenses added yet.
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // Get the form
        const expenseForm =
            document.getElementById("expenseForm");


        // Get the expense list
        const expenseList =
            document.getElementById("expenseList");


        // Get the total display
        const totalDisplay =
            document.getElementById("totalAmount");


        // Get the empty message
        const emptyMessage =
            document.getElementById("emptyMessage");


        // Store the total amount
        let totalAmount = 0;


        // Run this code when Add Expense is clicked
        expenseForm.addEventListener("submit", function(event) {

            // Stop the page from refreshing
            event.preventDefault();


            // Get the values entered by the user

            const name =
                document.getElementById("expenseName").value.trim();


            const amount =
                Number(
                    document.getElementById("expenseAmount").value
                );


            const category =
                document.getElementById("expenseCategory").value;


            const date =
                document.getElementById("expenseDate").value;


            // Check the amount

            if (name === "") {
                alert("Please enter an expense name.");
                return;
            }


            if (amount <= 0) {
                alert("Please enter an amount greater than 0.");
                return;
            }


            if (date === "") {
                alert("Please select a date.");
                return;
            }


            // Hide "No expenses added yet"

            emptyMessage.style.display = "none";


            // Create a new expense

            const expense =
                document.createElement("div");


            expense.className = "expense";


            expense.innerHTML = `

                <h3>${name}</h3>

                <p>
                    <strong>Amount:</strong> ₹${amount}
                </p>

                <p>
                    <strong>Category:</strong> ${category}
                </p>

                <p>
                    <strong>Date:</strong> ${date}
                </p>

            `;


            // Add the expense to the page

            expenseList.appendChild(expense);


            // Add amount to total

            totalAmount = totalAmount + amount;


            // Display the new total

            totalDisplay.textContent =
                "₹" + totalAmount;


            // Clear the form

            expenseForm.reset();

        });

    </script>

</body>

</html>
